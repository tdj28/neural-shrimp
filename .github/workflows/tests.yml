name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pytest -q
      - name: Diagnose EXP-008 platform replay without replacing its gate
        if: always()
        run: python tools/audit_information_platform.py evidence/EXP-008/attempt-001 --out /tmp/EXP-008-platform-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXP-008-platform-audit
          path: /tmp/EXP-008-platform-audit.json
          if-no-files-found: error
      - run: python -m neural_shrimp.cli validate experiments/manifests/*.json
      - run: python tools/summarize_pilots.py
      - run: python tools/build_evidence_figures.py --check
      - run: python tools/build_concept_figures.py --check
      - run: python tools/run_hopfield.py validate
      - run: python tools/summarize_hopfield.py
      - run: python tools/plot_hopfield.py evidence/EXP-004/attempt-001 --destination paper/figures --check
      - run: python tools/run_hopfield_controls.py validate
      - run: python tools/run_hopfield_controls.py verify --output evidence/EXP-005/attempt-001
      - run: python tools/plot_hopfield_controls.py evidence/EXP-005/attempt-001 --destination paper/figures --check
      - run: python tools/run_hopfield_drift.py validate
      - run: python tools/run_hopfield_drift.py verify --output evidence/EXP-006/attempt-001
      - run: python tools/plot_hopfield_drift.py evidence/EXP-006/attempt-001 --destination paper/figures --check
      - run: python tools/run_hopfield_holdout.py validate
      - run: python tools/run_hopfield_holdout.py verify --output evidence/EXP-007/attempt-001
      - run: python tools/plot_hopfield_holdout.py evidence/EXP-007/attempt-001 --destination paper/figures --check
      - run: python tools/run_hopfield_information.py validate
      - run: python tools/check_information_bundle.py
      - run: python tools/run_hopfield_information.py verify --output evidence/EXP-008/attempt-001
      - run: python tools/plot_hopfield_information.py evidence/EXP-008/attempt-001 --destination paper/figures --check
      - run: python tools/summarize_information_paper.py
