name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pytest -q
      - run: python -m neural_shrimp.cli validate experiments/manifests/*.json
      - run: python tools/summarize_pilots.py
