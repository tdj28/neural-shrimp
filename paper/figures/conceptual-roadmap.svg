    <dc:title>conceptual-roadmap</dc:title>
    <dc:date>2026-09-11T00:00:00+00:00</dc:date>
    <dc:description>Four gated stages identify a cycle, measure phase-dependent observables, cross a verified boundary with matched interventions, and test quality or cost against simpler controls. This is a plan, not a completed result.</dc:description>
