   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2468a0" x="41.415688" y="82.195742" transform="rotate(-0 41.415688 82.195742)">A  Establish a neural periodic regime</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233247" x="41.415688" y="97.138787" transform="rotate(-0 41.415688 97.138787)">Full-state orbit closure + multiplier stability</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #707883" x="41.415688" y="111.364375" transform="rotate(-0 41.415688 111.364375)">If absent: refine or relabel the search</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c96819" x="41.415688" y="148.640582" transform="rotate(-0 41.415688 148.640582)">B  Measure what survives the readout</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233247" x="41.415688" y="163.583627" transform="rotate(-0 41.415688 163.583627)">Phase predictions, gradients, averaging bias</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #707883" x="41.415688" y="177.809215" transform="rotate(-0 41.415688 177.809215)">If output-invisible: test sensitivity and cost</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #287c64" x="41.415688" y="215.085422" transform="rotate(-0 41.415688 215.085422)">C  Cross a verified boundary</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233247" x="41.415688" y="230.028467" transform="rotate(-0 41.415688 230.028467)">Equal-dose normal / tangent / random; zero-dose sham</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #707883" x="41.415688" y="244.254055" transform="rotate(-0 41.415688 244.254055)">If no added prediction: favor the simpler diagnostic</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ac3b40" x="41.415688" y="281.530262" transform="rotate(-0 41.415688 281.530262)">D  Test a useful decision</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233247" x="41.415688" y="296.473307" transform="rotate(-0 41.415688 296.473307)">Quality, robustness, or compute to a target</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #707883" x="41.415688" y="310.698895" transform="rotate(-0 41.415688 310.698895)">Charge mapping, diagnostics, tuning and failures</text>
   </g>
  </g>
