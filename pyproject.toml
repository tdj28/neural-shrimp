[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-shrimp"
version = "0.1.0"
description = "Reproducible exploratory studies of periodic neural dynamics and their utility"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "datasets>=5.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dl = [
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
llm = [
    # the language-model stack of the study, at the versions the local runs and the pods used
    # (tools/runpod_soft_runner.sh installs the same pins and logs them per pod in versions.txt)
    "transformers==5.19.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "accelerate==1.15.0",
]
exp020 = [
    # The same wheel as the frozen EXP-020 lock (requirements-exp020.lock), now resolved from PyPI.
    "python-flint==0.9.0",
]

[project.scripts]
neural-shrimp = "neural_shrimp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
