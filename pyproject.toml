[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-shrimp"
version = "0.1.0"
description = "Reproducible exploratory studies of periodic neural dynamics and their utility"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]
dl = [
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
exp020 = [
    "python-flint",
]

[project.scripts]
neural-shrimp = "neural_shrimp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
python-flint = { path = "../neural-shrimp-data/dependencies/EXP-020/python-flint-0.9.0/python_flint-0.9.0-cp310-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" }
