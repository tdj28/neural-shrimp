[pytest]
# Kept outside pyproject.toml, whose hash frozen plans pin; repeats its settings.
# tests/test_unit_flip_corner_driver.py and tests/reviews/test_unit_flip_corner_driver.py
# are different receipt-bound files with the same basename, which pytest's default
# import mode cannot collect in one session. The review copy is excluded here and
# must be run on its own:
#   pytest -p no:cacheprovider tests/reviews/test_unit_flip_corner_driver.py
testpaths = tests
pythonpath = src
addopts = --ignore=tests/reviews/test_unit_flip_corner_driver.py
